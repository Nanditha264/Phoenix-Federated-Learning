[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl_benchmark"
version = "0.1.0"
description = "Federated Learning Experimental Benchmark: FedAvg vs FedProx on PathMNIST"
authors = [{ name = "Federated Learning Research Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "medmnist",
    "numpy",
    "scipy",
    "scikit-learn",
    "psutil",
    "pyyaml",
    "wandb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
pythonpath = ["..", "."]
